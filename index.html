<div class="hd">Оформление</div><div class="sg" style="margin-top:0">${[['l','☀ Светлая'],['d','🌙 Тёмная'],['a','Авто']].map(x=>`<button class="${S.th===x[0]?'a':''}" onclick="S.th='${x[0]}';sv();theme();prof()">${x[1]}</button>`).join('')}</div>
<div class="r" style="margin-top:12px;justify-content:flex-start;gap:12px"><span class="m">Цвет:</span>${AC.map((a,i)=>`<button style="width:34px;height:34px;border-radius:50%;background:${a[0]};${S.ac===i?'outline:3px solid var(--ink);outline-offset:2px':''}" onclick="S.ac=${i};sv();theme();prof()"></button>`).join('')}</div>
<div class="hd">Настройки</div>${[['st','🎓 Я студент (скидки по билету)'],['nt','🔔 Уведомления об акциях рядом']].map(x=>`<div class="bx r" style="margin-top:8px;cursor:pointer" onclick="S.${x[0]}=S.${x[0]}?0:1;sv();prof()"><span style="font-size:13px;font-weight:600">${x[1]}</span><span class="tg ${S[x[0]]?'a':''}"></span></div>`).join('')}
<div class="bx" style="margin-top:8px"><div class="r m"><span>Радиус по умолчанию</span><b style="color:var(--ink)" id="prv">${km(S.rd)} км</b></div><input type="range" min="0.5" max="3" step="0.5" value="${S.rd}" oninput="S.rd=+this.value;$('prv').textContent=km(this.value)+' км';$('rad').value=this.value;$('rv').textContent=km(this.value)+' км';sv()"></div>
<div class="hd">Любимые категории</div><div class="cw">${C.slice(1).map(c=>`<button class="ch ${S.pf.includes(c)?'a':''}" onclick="S.pf=S.pf.includes('${c}')?S.pf.filter(x=>x!=='${c}'):[...S.pf,'${c}'];sv();prof()">${E[c]} ${c}</button>`).join('')}</div>
<div class="hd">Для заведений</div><button class="b o" onclick="go('bz')">🏪 Кабинет заведения (демо)</button><button class="b o" style="margin-top:10px;color:var(--ac);border-color:var(--ac)" onclick="if(confirm('Сбросить все данные?')){localStorage.removeItem('bite2');location.reload()}">Сбросить данные приложения</button>`}
function avSh(){sh(`<h2>Аватар</h2><div class="cw" style="margin-top:14px">${AV.map(a=>`<button class="av" style="width:60px;height:60px;font-size:30px;${S.av===a?'outline:3px solid var(--ink)':''}" onclick="S.av='${a}';sv();theme();prof();shx()">${a}</button>`).join('')}</div>`)}
function biz(){const v=R[S.mine];$('bz').innerHTML=`<div class="r"><button class="i" onclick="go('pr',1)">‹</button><h2>Кабинет заведения</h2><span style="width:42px"></span></div><div class="m" style="margin:12px 0">Демо-режим: заведение само включает и выключает акции — они сразу появляются в приложении у гостей.</div>
<select onchange="S.mine=+this.value;sv();biz()">${R.map(x=>`<option value="${x.i}" ${x.i===S.mine?'selected':''}>${x.e} ${x.n}</option>`).join('')}</select><div class="hd">Мои акции</div>
${Object.keys(DL).map(c=>`<div class="bx r" style="margin-top:8px;cursor:pointer" onclick="bzt('${c}')"><div style="display:flex;gap:12px;align-items:center"><span style="font-size:24px">${DL[c][0]}</span><div><b style="font-size:13px">${DL[c][1]}</b><div class="m">${DL[c][2]}</div></div></div><span class="tg ${dls(v).includes(c)?'a':''}"></span></div>`).join('')}
<div class="hd">Так увидят гости</div>${card(v)}<button class="b" style="margin-top:16px" onclick="toast('✅ Акции опубликованы')">Опубликовать</button>`}
function bzt(c){const v=R[S.mine],a=dls(v);S.dl[v.i]=a.includes(c)?a.filter(x=>x!==c):[...a,c];sv();biz()}
function sh(h){$('sb').innerHTML=h;$('sh').classList.add('a')}function shx(){$('sh').classList.remove('a')}
function locSh(){sh(`<h2>Где вы находитесь?</h2>${[['🎓','Университет'],['🏠','Общежитие'],['📍','Токмок'],['🛰','Определить автоматически']].map(l=>`<button class="lo ${l[1]===city?'a':''}" onclick="loc('${l[1]}')"><span style="font-size:20px">${l[0]}</span>${l[1]}</button>`).join('')}`)}
function loc(c){shx();if(c[0]==='О'){toast('🛰 Определяем местоположение…');if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{city='Токмок';$('cy').textContent='📍 Рядом со мной ▾';toast('📍 '+p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3))},()=>{city='Токмок';$('cy').textContent='📍 Токмок ▾';toast('Не удалось определить — выбран Токмок')},{timeout:5000});return}city=c;$('cy').textContent='📍 '+c+' ▾';toast('📍 Ищем рядом: '+c)}
function fsh(){const ch=(l,on,fn)=>`<button class="ch ${on?'a':''}" onclick="${fn}">${l}</button>`;sh(`<div class="r"><h2>Фильтры</h2><button class="m" style="background:none;color:var(--ac)" onclick="F={p:[],r:0,d:'',s:'d',dd:0};oo=true;tgs();fsh()">Сбросить</button></div>
<div class="hd">Сортировка</div><div class="cw">${[['d','Ближе'],['r','Рейтинг'],['p','Дешевле']].map(x=>ch(x[1],F.s===x[0],`F.s='${x[0]}';fsh()`)).join('')}</div>
<div class="hd">Цена</div><div class="cw">${[1,2,3].map(p=>ch('$'.repeat(p),F.p.includes(p),`F.p=F.p.includes(${p})?F.p.filter(x=>x!==${p}):[...F.p,${p}];fsh()`)).join('')}</div>
<div class="hd">Рейтинг</div><div class="cw">${[[0,'Любой'],[4,'4.0+'],[4.5,'4.5+']].map(x=>ch(x[1],F.r===x[0],`F.r=${x[0]};fsh()`)).join('')}</div>
<div class="hd">Акции</div><div class="cw">${ch('Любые',!F.d,"F.d='';fsh()")}${Object.keys(DL).map(c=>ch(DL[c][0]+' '+DL[c][1],F.d===c,`F.d='${c}';F.dd=0;fsh()`)).join('')}</div>
<div class="bx r" style="margin-top:16px;cursor:pointer" onclick="tgl();fsh()"><span style="font-size:13px;font-weight:600">Только открытые сейчас</span><span class="tg ${oo?'a':''}"></span></div>
<button class="b" style="margin-top:16px" onclick="shx();if(sc.id==='mp')mapR();else go('res')">Показать (${match().length})</button>`)}
function tgs(){$('tg').classList.toggle('a',oo)}function tgl(){oo=!oo;tgs();if(sc.id==='res')rend();if(sc.id==='mp')mapR()}
function search(){$('ld').classList.add('a');setTimeout(()=>{$('ld').classList.remove('a');go('res')},800)}
function toast(t){const e=$('ts');e.textContent=t;e.classList.add('a');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('a'),1800)}
$('cats').innerHTML=C.map((c,i)=>`<button class="ch ${i?'':'a'}" onclick="cat='${c}';[...$('cats').children].forEach(x=>x.classList.toggle('a',x===this))">${E[c]} ${c}</button>`).join('');
$('rad').value=S.rd;$('rv').textContent=km(S.rd)+' км';$('rad').oninput=e=>{$('rv').textContent=km(e.target.value)+' км';home()};
theme();setTimeout(()=>{if(sc.id==='sp')go('home')},2600);
</script></body></html>
